name: KELYANI PR validation

on:
  pull_request:
    branches:
      - audit/pre-commercial-global
    paths:
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/kelyani-pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Web Push Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/send-loyalty-notification-push/index.ts
      - name: Production build
        run: npm run build
