name: KELYANI PR validation

on:
  pull_request:
    branches:
      - audit/pre-commercial-global
    paths:
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/kelyani-pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
