name: E2E — Vercel Preview + Supabase Staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: kelyani-e2e-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  e2e-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ github.event.pull_request.head.ref == 'feat/google-wallet-staging-tests' && 'https://tapmarrakech-git-feat-google-wal-8a3a4d-simohamedelhafiani-7962.vercel.app' || vars.KELYANI_INTEGRATION_PREVIEW_URL }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_RESPONSIBLE_EMAIL: ${{ secrets.E2E_RESPONSIBLE_EMAIL }}
      E2E_RESPONSIBLE_PASSWORD: ${{ secrets.E2E_RESPONSIBLE_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify E2E secret availability (never print values)
        shell: bash
        run: |
          missing=0
          for name in E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_CLIENT_EMAIL E2E_CLIENT_PASSWORD E2E_RESPONSIBLE_EMAIL E2E_RESPONSIBLE_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret is unavailable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Check whether the values are Repository secrets or Environment secrets. If they are Environment secrets, bind this job to the exact existing GitHub Environment name."
            exit 1
          fi
      - name: Verify branch-specific Preview target
        id: preview-target
        shell: bash
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No dedicated integration Preview URL is configured. E2E is safely skipped; configure KELYANI_INTEGRATION_PREVIEW_URL after Vercel creates the branch deployment."
            exit 0
          fi
          node -e "const u=new URL(process.env.E2E_BASE_URL); if(!u.hostname.endsWith('.vercel.app')) throw new Error('E2E_BASE_URL must be a Vercel Preview URL'); if(u.hostname==='tapmarrakech-git-feat-google-wal-8a3a4d-simohamedelhafiani-7962.vercel.app') throw new Error('Refusing to test the old Google Wallet branch Preview for the integration branch'); const s=new URL(process.env.E2E_SUPABASE_URL); if(s.hostname!=='jsllksnmylpxcgqaeidq.supabase.co') throw new Error('E2E_SUPABASE_URL must target Kelyani-Staging (jsllksnmylpxcgqaeidq), never Production')"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Run Preview E2E and Staging checks
        if: steps.preview-target.outputs.available == 'true'
        run: npx playwright test e2e/google-wallet-staging.spec.ts
      - name: Run Supabase Edge Function unit tests
        if: always()
        run: deno test --allow-env supabase/functions/_shared/*.test.ts
      - name: Upload E2E report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kelyani-e2e-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
