name: E2E — Vercel Preview + Supabase Staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: kelyani-e2e-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_RESPONSIBLE_EMAIL: ${{ secrets.E2E_RESPONSIBLE_EMAIL }}
      E2E_RESPONSIBLE_PASSWORD: ${{ secrets.E2E_RESPONSIBLE_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Run Preview E2E and Staging checks
        run: npx playwright test
      - name: Upload E2E report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kelyani-e2e-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
