name: E2E — Vercel Preview + Supabase Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kelyani-e2e-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'qa/precommercial-smoke-2026-11-19' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ secrets.KELYANI_FINAL_PREVIEW_URL || 'https://tapmarrakech-git-qa-precommercia-7a9849-simohamedelhafiani-7962.vercel.app/' }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_RESPONSIBLE_EMAIL: ${{ secrets.E2E_RESPONSIBLE_EMAIL }}
      E2E_RESPONSIBLE_PASSWORD: ${{ secrets.E2E_RESPONSIBLE_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify E2E secret availability (never print values)
        shell: bash
        run: |
          missing=0
          for name in E2E_BASE_URL E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_RESPONSIBLE_EMAIL E2E_RESPONSIBLE_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret is unavailable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure KELYANI_FINAL_PREVIEW_URL and the E2E Supabase Staging secrets before certification."
            exit 1
          fi
          node -e "const u=new URL(process.env.E2E_BASE_URL); if(u.protocol!=='https:' || !u.hostname.endsWith('.vercel.app')) process.exit(1); const s=new URL(process.env.E2E_SUPABASE_URL); if(s.hostname!=='jsllksnmylpxcgqaeidq.supabase.co') process.exit(1); console.log('Preview host and Supabase Staging project verified.')"
      - name: Confirm the branch-specific Preview is deployed
        shell: bash
        run: |
          node -e "console.log('E2E Preview host:', new URL(process.env.E2E_BASE_URL).host)"
          marker='name="kelyani-preview-track" content="kelyani-final-consolidation-2026-11-v1"'
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 5 --max-time 15 -L -fsS -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" -H "x-vercel-set-bypass-cookie: true" "$E2E_BASE_URL" | grep -Fq "$marker"; then
              echo "Current final consolidation Preview confirmed."
              exit 0
            fi
            echo "Waiting for current Preview deployment ($attempt/30)..."
            sleep 10
          done
          echo "::error::E2E_BASE_URL is not serving the current Nardo/Wallet integration Preview."
          exit 1
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      # This gated pull request run excludes tests that write Staging data.
      - name: Run non-mutating Preview and Staging checks
        if: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test tests/e2e/preflight.spec.ts tests/e2e/scanner-security.spec.ts tests/e2e/google-business-security.spec.ts
      - name: Run full Preview E2E and Staging checks
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx playwright test
      - name: Upload E2E report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kelyani-e2e-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
