# pg_cron authenticates this endpoint with its shared secret; the handler validates it.
[functions.google-business-sync-access-test]
verify_jwt = false

[functions.google-wallet-staging-check]
verify_jwt = true

# Public customer-card endpoint: the UUID access token is validated through
# the existing get_public_loyalty_* RPCs before a signed save-to-Wallet URL
# is returned. No privileged Supabase key is exposed to the browser.
[functions.google-wallet-create-pass]
verify_jwt = false

[functions.google-wallet-publish-design]
verify_jwt = true
